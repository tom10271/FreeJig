name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test policy
        run: swift run FreeJigChecks
      - name: Build app
        run: bash scripts/build-app.sh
      - name: Check startup and window placement
        run: .build/FreeJig.noindex/FreeJig.app/Contents/MacOS/FreeJig --verify-placement
      - uses: actions/upload-artifact@v4
        with:
          name: FreeJig-macOS
          path: dist/*.zip
